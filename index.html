<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10100f">
<title>SUCCESS HABIT TRACKER</title>
<style>
:root{color-scheme:dark;--bg:#10100f;--panel:#1a1916;--panel2:#222019;--gold:#d7b56d;--gold2:#f0d99c;--muted:#aaa397;--line:#39352b;--green:#8eb99a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292316 0,#10100f 46%);color:#f5f0e5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
.app{max-width:560px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 18px}.eyebrow{letter-spacing:.22em;color:var(--gold);font-size:10px;font-weight:700}.brand{font-family:Georgia,serif;font-size:25px;letter-spacing:.04em;margin:7px 0 0}.date{color:var(--muted);font-size:12px;text-align:right;line-height:1.6}.hero{border:1px solid #5a4a2b;background:linear-gradient(135deg,#292316,#171510 70%);border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center;box-shadow:0 16px 45px #0005}.label{font-size:10px;letter-spacing:.18em;color:var(--gold)}.percent{font-family:Georgia,serif;font-size:43px;margin:5px 0}.sub{font-size:12px;color:var(--muted)}.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--progress,0%),#403a2d 0);position:relative}.ring:before{content:"";position:absolute;inset:8px;background:#1d1a14;border-radius:50%}.ring span{position:relative;font-family:Georgia,serif;font-size:20px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.stat strong{display:block;font-family:Georgia,serif;font-size:25px;color:var(--gold2);font-weight:500}.stat small{color:var(--muted);font-size:10px;letter-spacing:.12em}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 11px}.section h2{font-size:14px;letter-spacing:.12em;margin:0;font-weight:650}.section span{font-size:11px;color:var(--muted)}.habit-list{display:grid;gap:8px}.habit{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-height:59px;transition:.15s}.habit.done{border-color:#806a3e;background:linear-gradient(90deg,#282216,#1a1916)}.check{width:23px;height:23px;border:1.5px solid #776d58;border-radius:8px;display:grid;place-items:center;flex:none;color:#17140e}.done .check{background:var(--gold);border-color:var(--gold)}.check svg{width:15px;height:15px;display:none}.done .check svg{display:block}.habit-name{font-size:13px;flex:1}.habit-meta{font-size:10px;color:var(--muted)}.done .habit-name{color:#e6d6ae}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#211f1a;color:var(--gold2);font-size:11px;font-weight:600;flex:1}.btn.primary{background:var(--gold);color:#17130b;border-color:var(--gold)}.note{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:15px;margin-top:18px}.note label{display:block;color:var(--gold);font-size:10px;letter-spacing:.15em;margin-bottom:9px}.note textarea{width:100%;min-height:75px;resize:vertical;background:#12110f;border:1px solid var(--line);border-radius:10px;padding:11px;color:#f5f0e5;font:13px/1.5 inherit;outline:none}.note textarea:focus{border-color:var(--gold)}.footer{color:#777064;font-size:10px;text-align:center;margin:22px 0 8px;line-height:1.7}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e4c987;color:#17130b;padding:10px 15px;border-radius:30px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.history{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:center;padding:9px 2px}.day b{display:block;font-size:12px;color:var(--gold2)}.day small{font-size:9px;color:var(--muted)}@media(min-width:520px){body{padding-top:28px}.hero{padding:25px}.habit{padding:15px 17px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
 <div><div class="eyebrow">PERSONAL PERFORMANCE SYSTEM</div><div class="brand">SUCCESS HABIT TRACKER</div></div>
 <div class="date" id="today"></div>
</header>
<section class="hero">
 <div><div class="label">TODAY'S PROGRESS</div><div class="percent" id="percent">0%</div><div class="sub" id="progressText">今日の一歩を積み上げよう。</div></div>
 <div class="ring" id="ring"><span id="ringText">0/10</span></div>
</section>
<section class="stats">
 <div class="stat"><strong id="streak">0</strong><small>DAY STREAK</small></div>
 <div class="stat"><strong id="total">0</strong><small>COMPLETED HABITS TODAY</small></div>
</section>
<div class="section"><h2>DAILY HABITS</h2><span id="countLabel">0 of 10 completed</span></div>
<div class="habit-list" id="habits"></div>
<div class="actions">
 <button class="btn primary" id="allBtn">すべて完了にする</button>
 <button class="btn" id="resetBtn">今日をリセット</button>
</div>
<div class="section"><h2>LAST 7 DAYS</h2><span>継続を可視化</span></div>
<div class="history" id="history"></div>
<div class="note">
 <label for="reflection">DAILY REFLECTION / 今日の振り返り</label>
 <textarea id="reflection" placeholder="今日できたこと、学んだこと、明日改善すること…"></textarea>
</div>
<div class="footer">CONSISTENCY OVER INTENSITY.<br>小さく続ける。記録する。改善する。</div>
</main>
<div class="toast" id="toast">保存しました</div>
<script>
const habits=["英語を勉強する","集中学習を60分行う","金融・経済を学ぶ","読書をする","身体を動かす","睡眠・起床時刻を整える","SNSの無目的な閲覧を減らす","今日の支出を確認する","失敗と改善点を記録する","翌日の計画を立てる"];
const key="success-habit-tracker-v1";
let db={};
try{db=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){db={}}
const dateKey=d=>{let x=new Date(d);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,"0"),String(x.getDate()).padStart(2,"0")].join("-")};
const today=dateKey(new Date());
if(!db[today])db[today]={done:[],note:""};
const $=id=>document.getElementById(id);
$("today").textContent=new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date());
function save(){localStorage.setItem(key,JSON.stringify(db));render();toast()}
function toast(){$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1000)}
function streak(){let n=0,d=new Date();while(true){let k=dateKey(d),v=db[k];if(!v||v.done.length===0)break;n++;d.setDate(d.getDate()-1)}return n}
function render(){
 let data=db[today],n=data.done.length,p=Math.round(n/habits.length*100);
 $("percent").textContent=p+"%";$("ringText").textContent=n+"/10";$("ring").style.setProperty("--progress",p+"%");
 $("progressText").textContent=n===10?"本日のミッション完了。よくやった。":n===0?"今日の一歩を積み上げよう。":`あと${10-n}個。焦らず一つずつ。`;
 $("streak").textContent=streak();$("total").textContent=n;$("countLabel").textContent=`${n} of 10 completed`;
 $("habits").innerHTML=habits.map((h,i)=>`<div class="habit ${data.done.includes(i)?"done":""}" data-i="${i}" role="button" tabindex="0" aria-pressed="${data.done.includes(i)}"><div class="check"><svg viewBox="0 0 20 20" fill="none"><path d="m4 10 4 4 8-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="habit-name">${h}</div><div class="habit-meta">${data.done.includes(i)?"COMPLETED":"TAP TO CHECK"}</div></div>`).join("");
 document.querySelectorAll(".habit").forEach(el=>{let fn=()=>toggle(+el.dataset.i);el.addEventListener("click",fn);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}})});
 $("reflection").value=data.note||"";
 $("history").innerHTML=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let k=dateKey(d),v=db[k],c=v?v.done.length:0;return `<div class="day"><b>${c}/10</b><small>${["日","月","火","水","木","金","土"][d.getDay()]}</small></div>`}).join("");
}
function toggle(i){let a=db[today].done;db[today].done=a.includes(i)?a.filter(x=>x!==i):[...a,i];save()}
$("allBtn").onclick=()=>{db[today].done=db[today].done.length===10?[]:habits.map((_,i)=>i);save()};
$("resetBtn").onclick=()=>{if(confirm("今日のチェックをすべてリセットしますか？")){db[today].done=[];save()}};
$("reflection").addEventListener("input",e=>{db[today].note=e.target.value;localStorage.setItem(key,JSON.stringify(db))});
render();
</script>
</body>
</html>
